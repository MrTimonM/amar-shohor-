# Local dev dependencies only — the apps themselves run on the host via
# `npm run dev`, so hot reload stays fast. Phase 14 replaces every service
# here with its AWS counterpart (see IMPLEMENTATION_PLAN.md).
services:
  mongo:
    image: mongo:7
    container_name: amar-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]

  # Stands in for S3 so no application code knows it isn't on AWS yet.
  minio:
    image: minio/minio:latest
    container_name: amar-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: amar
      MINIO_ROOT_PASSWORD: amar-dev-secret
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  mongo-data:
  minio-data:
